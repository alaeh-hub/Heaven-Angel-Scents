# Production stack: Caddy (HTTPS) -> web (gunicorn) -> db (MySQL), plus a
# one-shot schema migration and a daily backup job.
# Required in .env (see .env.example): DOMAIN, DB_ROOT_PASSWORD, DB_APP_PASSWORD,
# SECRET_KEY. Full steps in docs/DOCKER_DEPLOY.md.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DB:-heaven_and_angel_scents}
      # Limited user the app connects as; it only has rights on MYSQL_DATABASE.
      MYSQL_USER: ${DB_APP_USER:-heaven_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD:?set DB_APP_PASSWORD in .env}
    # Host-only access for MySQL Workbench; 3306 on the host is the local MySQL84.
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Applies schema.sql on every `up`. It is idempotent (CREATE ... IF NOT EXISTS
  # plus guarded migration blocks), so this covers both the first run and later
  # schema changes. Back up before deploying schema changes (see docs/BACKUP.md).
  migrate:
    image: mysql:8.4
    restart: "no"
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./schema.sql:/schema.sql:ro
    # Retries only while the db isn't accepting connections yet (after a
    # Docker daemon restart containers start without honouring depends_on).
    # Any other failure is a real SQL error in schema.sql: print it and stop
    # at once instead of re-running the same failing script for 100 seconds.
    command:
      - sh
      - -c
      - |
        for i in $$(seq 1 30); do
          if out=$$(mysql -h db -uroot < /schema.sql 2>&1); then
            exit 0
          fi
          echo "$$out" >&2
          case "$$out" in
            *"ERROR 2002"*|*"ERROR 2003"*|*"ERROR 2013"*)
              echo "migrate: db not ready (attempt $$i/30), retrying" >&2
              sleep 3
              ;;
            *)
              echo "migrate: schema.sql failed with the error above - not retrying" >&2
              exit 1
              ;;
          esac
        done
        exit 1

  web:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      APP_ENV: production
      FLASK_DEBUG: "0"
      ALLOW_DATA_RESET: "0"
      # Set to 1 in .env ONLY to wipe test data via Admin > Clear Data, then set it back to 0.
      ALLOW_DATA_RESET_IN_PRODUCTION: ${ALLOW_DATA_RESET_IN_PRODUCTION:-0}
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
      MYSQL_USER: ${DB_APP_USER:-heaven_app}
      MYSQL_PASSWORD: ${DB_APP_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-heaven_and_angel_scents}
      # Only Caddy can reach this container (no published port), so trusting
      # its X-Forwarded-* headers is safe.
      # "same-origin" accepts whichever host the browser used (domain or LAN IP),
      # unlike a fixed https://DOMAIN which silently kills realtime on other hosts.
      SOCKETIO_CORS_ALLOWED_ORIGINS: ${SOCKETIO_CORS_ALLOWED_ORIGINS:-same-origin}
      # Required: the shared partner-portal link must survive restarts.
      PARTNER_PORTAL_SLUG: ${PARTNER_PORTAL_SLUG:?set PARTNER_PORTAL_SLUG in .env}
      TRUST_PROXY: "1"
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    volumes:
      - uploads:/app/static/uploads
      # Safety copies written by Settings -> Backup -> Restore; kept across rebuilds.
      - appbackups:/app/backups

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "8080:80"
      - "8443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Daily database dump + uploads archive into ./backups on the host. Copy that
  # folder off the server too (see docs/BACKUP.md "Off-site copy").
  backup:
    image: mysql:8.4
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_PWD: ${DB_ROOT_PASSWORD}
      MYSQL_DB: ${MYSQL_DB:-heaven_and_angel_scents}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HEARTBEAT_URL: ${BACKUP_HEARTBEAT_URL:-}
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # pipefail: a failed mysqldump must fail the pipeline, otherwise gzip's
        # success hides it and an empty .sql.gz is reported as "backup ok".
        set -o pipefail
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          tmp="/backups/$${MYSQL_DB}_$$ts.sql.gz.tmp"
          # Retry briefly so a daemon restart (db not up yet) doesn't cost a whole day.
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if mysqldump -h db -uroot --single-transaction --routines --triggers --events "$$MYSQL_DB" | gzip > "$$tmp" && [ "$$(stat -c %s "$$tmp")" -gt 200 ]; then
              ok=1; break
            fi
            rm -f "$$tmp"
            sleep 10
          done
          if [ "$$ok" = 1 ]; then
            mv "$$tmp" "/backups/$${MYSQL_DB}_$$ts.sql.gz"
            echo "backup ok: $$ts"
            # Dead-man's-switch: ping only on success, so the monitor alerts when
            # pings stop (failure, container down, or host down). Optional.
            if [ -n "$${BACKUP_HEARTBEAT_URL:-}" ]; then
              curl -fsS -m 10 --retry 3 "$$BACKUP_HEARTBEAT_URL" >/dev/null || echo "heartbeat ping FAILED: $$ts" >&2
            fi
          else
            echo "backup FAILED: $$ts" >&2
          fi
          tar -czf "/backups/uploads_$$ts.tar.gz" -C /data uploads || echo "uploads archive FAILED: $$ts" >&2
          find /backups -type f \( -name '*.sql.gz' -o -name '*.tar.gz' \) -mtime +$$BACKUP_RETENTION_DAYS -delete
          sleep 86400
        done

volumes:
  dbdata:
  uploads:
  appbackups:
  caddy_data:
  caddy_config:
