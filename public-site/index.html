<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#070708">
  <title>Business Partners · Heaven &amp; Angel Scents</title>
  <meta name="description" content="Browse Heaven &amp; Angel Scents' wholesale perfume packages and submit a partner inquiry — pricing, bundles, and bottle details for distributors and resellers.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Link-preview card (Messenger/Viber/Facebook) for the portal link HQ
       shares directly with a distributor/reseller — this page is never
       linked publicly (see routes/portal.py's slug gating), but a shared
       chat link still gets unfurled by the recipient's app. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Heaven &amp; Angel Scents">
  <meta property="og:title" content="Heaven &amp; Angel Scents — Business Partners">
  <meta property="og:description" content="Wholesale perfume packages and pricing for distributors and resellers.">
  <meta property="og:image" content="/static/img/icon_180.png">
  <meta name="twitter:card" content="summary">
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icon_180.png">
  <!-- The hero scene's bottle labels (textures in PerfumeScene), fetched
       alongside the app bundle so the first frame isn't waiting on them.
       crossorigin matches three.js's TextureLoader (it requests images in
       anonymous CORS mode); without it the browser can't reuse these and
       downloads each label a second time. -->
  <link rel="preload" as="image" href="/static/img/scene-label-uriel.jpg" crossorigin="anonymous">
  <link rel="preload" as="image" href="/static/img/scene-label-raphael.jpg" crossorigin="anonymous">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
