<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ code }} · Heaven &amp; Angel Scents</title>
  <script>
    // Same dark-by-default stamping as every other page (see base.html) —
    // without this, an error page hit before any other page loads would
    // render in the light palette regardless of what's actually stored.
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-theme', stored || 'dark');
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <div class="error-shell">
    <div class="code">{{ code }}</div>
    <h2>{{ message }}</h2>
    <a class="btn btn-primary mt-24" href="{{ url_for('auth.index') }}">Back to safety</a>
  </div>
</body>

</html>
