name: Deploy

on:
  # Automatic: every time CI finishes green for a push to main.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Manual: still available from the Actions tab (re-deploy, rollback to a commit).
  workflow_dispatch:

# One deploy at a time; a newer push waits for the running one instead of
# racing it, and an in-progress deploy is never cancelled half way.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production
    # Auto-deploy only after a successful CI run of a push to main (never for
    # a pull request or a failed run). A manual run has no such condition.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    env:
      # The commit CI actually tested. For workflow_run, github.sha is just the
      # newest commit on main, which may not be the one that passed.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    permissions:
      contents: read
      actions: read

    steps:
      # Refuse to deploy a commit whose CI run has not finished green.
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          result="$(gh run list --repo "${{ github.repository }}" --workflow ci.yml             --commit "$DEPLOY_SHA" --json conclusion --jq '[.[] | select(.conclusion == "success")] | length')"
          if [ "${result:-0}" -lt 1 ]; then
            echo "No successful CI run found for $DEPLOY_SHA; refusing to deploy." >&2
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned host key (secret DEPLOY_KNOWN_HOSTS = output of
          # `ssh-keyscan -p PORT HOST` taken once from a trusted network).
          # Required: trust-on-first-use would let a MITM on the first run
          # capture the deploy session.
          if [ -z "${{ secrets.DEPLOY_KNOWN_HOSTS }}" ]; then
            echo "DEPLOY_KNOWN_HOSTS secret is not set; refusing to deploy." >&2
            exit 1
          fi
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # Docker deploy, see docs/DOCKER_DEPLOY.md section 4: pull, take a pre-deploy
      # database dump, rebuild and restart the stack (the migrate job applies
      # schema.sql), then fail the run unless web reports healthy.
      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEPLOY_PORT || '22' }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" bash -s <<'REMOTE'
            set -euo pipefail
            cd /opt/heaven-and-angel

            git pull --ff-only

            # pipefail + size check: otherwise a failed mysqldump leaves an empty
            # .gz that looks like a good backup and the deploy carries on.
            docker compose exec -T backup bash -c '
              set -euo pipefail
              f=/backups/pre_deploy_$(date +%Y%m%d_%H%M%S).sql.gz
              mysqldump -h db -uroot --single-transaction --routines --triggers --events "$MYSQL_DB" | gzip > "$f"
              [ "$(stat -c %s "$f")" -gt 200 ] || { rm -f "$f"; echo "pre-deploy dump is empty" >&2; exit 1; }
            '

            docker compose up -d --build --remove-orphans

            for i in $(seq 1 30); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")"
              [ "$status" = "healthy" ] && { echo "web is healthy"; exit 0; }
              sleep 5
            done
            echo "web did not become healthy" >&2
            docker compose logs --tail 50 web >&2
            exit 1
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
