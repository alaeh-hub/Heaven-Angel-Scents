name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-secret-key
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DB: heaven_and_angel_scents
      GEMINI_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall app.py config.py db.py decorators.py extensions.py routes seed.py utils.py wsgi.py

      - name: Validate app factory
        run: python -c "from app import app; assert {'admin', 'ai', 'auth', 'branch'} <= set(app.blueprints)"

      - name: Load database schema
        run: mysql -h 127.0.0.1 -P 3306 -u root < schema.sql

      - name: Smoke test database connection
        run: python -c "from app import app; import db; ctx = app.app_context(); ctx.push(); row = db.query('SELECT COUNT(*) AS c FROM branches', fetchone=True); assert row['c'] >= 1; ctx.pop()"
