name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install ruff

      - name: Run ruff check
        run: ruff check .

  public-site:
    name: Build public-site
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: public-site/package-lock.json

      - name: Install dependencies
        working-directory: public-site
        run: npm ci

      - name: Build
        working-directory: public-site
        run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit
        run: python -m pip install pip-audit && pip-audit -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm audit (production deps)
        working-directory: public-site
        run: npm audit --omit=dev --audit-level=high

  docker-smoke:
    name: Docker stack smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Write throwaway .env
        run: |
          {
            echo "DOMAIN=localhost"
            echo "DB_ROOT_PASSWORD=ci-root-$(openssl rand -hex 8)"
            echo "DB_APP_PASSWORD=ci-app-$(openssl rand -hex 8)"
            echo "SECRET_KEY=$(openssl rand -hex 32)"
            echo "PARTNER_PORTAL_SLUG=ci-smoke-slug"
          } > .env

      - name: Build and start the production stack
        run: docker compose up -d --build db migrate web

      - name: Wait for web to report healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q web)")"
            [ "$status" = "healthy" ] && { echo "web is healthy"; exit 0; }
            sleep 5
          done
          docker compose logs --tail 80 web migrate >&2
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v

  test:
    name: Python checks
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: development
      FLASK_DEBUG: "0"
      SECRET_KEY: ci-secret-key
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ""
      MYSQL_DB: heaven_and_angel_scents
      GEMINI_API_KEY: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Compile Python files
        run: python -m compileall heaven_angel scripts app.py wsgi.py

      - name: Validate app factory
        run: python -c "from heaven_angel.app import app; assert {'admin', 'ai', 'auth', 'branch'} <= set(app.blueprints)"

      - name: Load database schema
        run: mysql -h 127.0.0.1 -P 3306 -u root < schema.sql

      - name: Smoke test database connection
        run: python -c "from heaven_angel.app import app; from heaven_angel import db; ctx = app.app_context(); ctx.push(); row = db.query('SELECT COUNT(*) AS c FROM branches', fetchone=True); assert row['c'] >= 1; ctx.pop()"

      - name: Run test suite
        run: python -m pytest -v
