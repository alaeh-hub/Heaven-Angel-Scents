<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6e27a"/>
      <stop offset="45%" stop-color="#caa24a"/>
      <stop offset="100%" stop-color="#8a6a25"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#000000"/>

  <!-- Ampersand -->
  <text x="32" y="46"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold"
        font-style="italic"
        font-size="42"
        text-anchor="middle"
        fill="#000000"
        stroke="url(#goldGrad)"
        stroke-width="1.2"
        paint-order="stroke fill">&amp;</text>
</svg>
