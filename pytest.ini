[pytest]
testpaths = tests
# Without this, `pytest`/`pytest.exe` (as opposed to `python -m pytest`,
# which adds the cwd to sys.path itself) can't find repo-root modules
# like utils/config/app from inside tests/ — pytest's own rootdir
# insertion only adds tests/ (since it has no __init__.py), never its
# parent. python -m pytest already works either way; this just makes
# the plain `pytest` entry point behave the same.
pythonpath = .
